<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>BLE Memory Monitor (Write/Indication)</title>
    <style>
        body { font-family: sans-serif; text-align: center; margin-top: 50px; }
        #output { 
            margin-top: 20px; 
            padding: 15px; 
            border: 1px solid #ddd; 
            max-width: 400px; 
            margin-left: auto; 
            margin-right: auto; 
            text-align: left; 
            line-height: 1.8;
            border-radius: 5px;
        }
        button { 
            padding: 10px 20px; 
            font-size: 16px; 
            margin: 5px;
            cursor: pointer;
            border: none;
            border-radius: 4px;
            color: white;
            background-color: #007bff;
        }
        button:disabled {
            background-color: #ccc;
            cursor: not-allowed;
        }
        #readMemoryButton {
            background-color: #28a745;
        }
        .error { color: red; }
        .success { color: green; }
    </style>
</head>
<body>

    <h1>BLE Device Memory Information</h1>

    <button id="connectButton">Connect to BLE Device</button>
    <button id="readMemoryButton" disabled>Request Memory Info</button>

    <p id="status">Ready. Click "Connect to BLE Device" to begin.</p>

    <div id="output">
        <strong>Free RAM (ram_bytes_free):</strong> <span id="freeRam">N/A</span><br>
        <strong>Free Storage (flash_bytes_free):</strong> <span id="freeFlash">N/A</span>
    </div>

    <script>
        // UUIDs derived from ble_spp_server.h
        const THYMIO_SERVICE_UUID = '0000abf0-0000-1000-8000-00805f9b34fb';
        const DEVICE_INFO_CHARACTERISTIC_UUID = '0000abf5-0000-1000-8000-00805f9b34fb';
        
        // Command and Response IDs derived from ble_spp.h
        const DEV_INFO_WRITE_MEMORY = 0x02; // Command to write
        const DEV_INFO_IND_MEMORY_RES = 0x02; // Expected response ID

        let bleDevice = null;
        let deviceInfoCharacteristic = null;

        const connectButton = document.getElementById('connectButton');
        const readMemoryButton = document.getElementById('readMemoryButton');
        const statusDiv = document.getElementById('status');
        const freeRamSpan = document.getElementById('freeRam');
        const freeFlashSpan = document.getElementById('freeFlash');

        /**
         * Converts bytes to a human-readable format.
         */
        function formatBytes(bytes) {
            if (bytes === 0) return '0 Bytes';
            const k = 1024;
            const sizes = ['Bytes', 'kB', 'MB', 'GB', 'TB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
        }

        function onDisconnected() {
            statusDiv.textContent = 'Device disconnected.';
            statusDiv.className = 'error';
            bleDevice = null;
            deviceInfoCharacteristic = null;
            readMemoryButton.disabled = true;
            connectButton.disabled = false;
        }
        
        /**
         * Handler for indication/notification events on the characteristic.
         * Processes the received data which includes a 3-byte header and JSON.
         * @param {Event} event 
         */
        function handleMemoryIndication(event) {
            const value = event.target.value;
            const buffer = value.buffer;
            
            // Header is 3 bytes: ID (1 byte) + Size (2 bytes LE)
            const HEADER_SIZE = 3; 
            
            if (buffer.byteLength < HEADER_SIZE) {
                statusDiv.textContent = `Indication error: Data too short (${buffer.byteLength} bytes).`;
                statusDiv.className = 'error';
                return;
            }

            try {
                const dataView = new DataView(buffer);

                // 1. Check the 1-byte response ID (at offset 0)
                const id = dataView.getUint8(0);
                if (id !== DEV_INFO_IND_MEMORY_RES) {
                    statusDiv.textContent = `Indication error: Unexpected response ID 0x${id.toString(16)}.`;
                    statusDiv.className = 'error';
                    return;
                }
                
                // 2. Read the 2-byte size (at offset 1, Little Endian 'true')
                const jsonLength = dataView.getUint16(1, true); 

                // 3. Slice the ArrayBuffer to get only the JSON payload (starts at offset 3)
                const jsonPayloadBuffer = buffer.slice(HEADER_SIZE);

                // 4. Decode the payload and parse JSON
                const decoder = new TextDecoder('utf-8');
                const jsonString = decoder.decode(jsonPayloadBuffer).trim();

                const memoryInfo = JSON.parse(jsonString);

                // 5. Update the display
                const freeRam = memoryInfo.ram_bytes_free;
                const freeFlash = memoryInfo.flash_bytes_free;

                freeRamSpan.textContent = `${freeRam} Bytes (${formatBytes(freeRam)})`;
                freeFlashSpan.textContent = `${freeFlash} Bytes (${formatBytes(freeFlash)})`;

                statusDiv.textContent = 'Memory information updated via BLE indication.';
                statusDiv.className = 'success';

            } catch (error) {
                statusDiv.textContent = `Processing error: ${error.message}. Check console for details.`;
                statusDiv.className = 'error';
                console.error("BLE Indication Processing Error:", error);
            }
        }


        async function connectDevice() {
            try {
                statusDiv.textContent = 'Searching for device...';
                statusDiv.className = '';
                connectButton.disabled = true;

                // 1. Request the BLE device
                bleDevice = await navigator.bluetooth.requestDevice({
                    filters: [{ services: [THYMIO_SERVICE_UUID] }],
                    optionalServices: [THYMIO_SERVICE_UUID]
                });

                statusDiv.textContent = `Connecting to ${bleDevice.name}...`;

                // 2. Connect to the GATT server
                const server = await bleDevice.gatt.connect();

                // 3. Get the Service and Characteristic
                const service = await server.getPrimaryService(THYMIO_SERVICE_UUID);
                deviceInfoCharacteristic = await service.getCharacteristic(DEVICE_INFO_CHARACTERISTIC_UUID);
                
                // 4. Set up Indication/Notification Listener
                deviceInfoCharacteristic.addEventListener('characteristicvaluechanged', handleMemoryIndication);
                await deviceInfoCharacteristic.startNotifications();

                statusDiv.textContent = `Connected to ${bleDevice.name}. Notifications enabled. Click 'Request Memory Info' to send the command.`;
                statusDiv.className = 'success';
                readMemoryButton.disabled = false;

                // Handle disconnection
                bleDevice.addEventListener('gattserverdisconnected', onDisconnected);

            } catch (error) {
                statusDiv.textContent = `Connection error: ${error.message}`;
                statusDiv.className = 'error';
                connectButton.disabled = false;
                console.error(error);
                bleDevice = null;
                deviceInfoCharacteristic = null;
                readMemoryButton.disabled = true;
            }
        }

        async function readMemoryInfo() {
            if (!deviceInfoCharacteristic) {
                statusDiv.textContent = 'Error: Not connected to the characteristic.';
                statusDiv.className = 'error';
                return;
            }

            try {
                statusDiv.textContent = 'Writing command to request memory information...';
                statusDiv.className = '';
                readMemoryButton.disabled = true;

                // The command is a single byte with value 0x02 (DEV_INFO_WRITE_MEMORY)
                const writeValue = new Uint8Array([DEV_INFO_WRITE_MEMORY]);
                
                // 1. Write the value
                await deviceInfoCharacteristic.writeValue(writeValue);

                statusDiv.textContent = 'Command sent. Waiting for indication...';
                
            } catch (error) {
                statusDiv.textContent = `Write command error: ${error.message}.`;
                statusDiv.className = 'error';
                console.error("BLE Write Error:", error);
            } finally {
                // Re-enable the button to allow retries, even if the indication is still pending
                readMemoryButton.disabled = false;
            }
        }

        // Event Listeners
        connectButton.addEventListener('click', connectDevice);
        readMemoryButton.addEventListener('click', readMemoryInfo);

    </script>

</body>
</html>
